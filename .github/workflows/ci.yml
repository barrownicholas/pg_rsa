name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg: [15, 17]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-server-dev-${{ matrix.pg }} \
            libssl-dev \
            pkg-config

      - name: Build and install
        run: |
          make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Run tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE EXTENSION pg_rsa;"
          psql -h localhost -U postgres -f test/test.sql
